name: lombardi-saude
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lombardi_saude}
      POSTGRES_USER: ${POSTGRES_USER:-lombardi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lombardi} -d ${POSTGRES_DB:-lombardi_saude}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [internal]
  django:
    image: ghcr.io/josegmontezano/lombardi-saude:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Configure DJANGO_SECRET_KEY}
      DJANGO_DEBUG: "false"
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:?Configure DJANGO_ALLOWED_HOSTS}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:?Configure CSRF_TRUSTED_ORIGINS}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-lombardi_saude}
      POSTGRES_USER: ${POSTGRES_USER:-lombardi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD}
      POSTGRES_SSLMODE: disable
      PUBLIC_BASE_URL: https://${DOMAIN:?Configure DOMAIN}
    networks: [internal]
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [django]
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN:?Configure DOMAIN}
    volumes:
      - ./hostinger/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [internal]
networks:
  internal:
volumes:
  postgres_data:
  caddy_data:
  caddy_config:
